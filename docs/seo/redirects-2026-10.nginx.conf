# CertBlueprint 301 redirect map, 2026-10-10. Same map as docs/seo/redirects-2026-10.csv.
#
# Production does NOT read this file: the site is a Cloudflare Worker, and the
# live copy of this map is RETIRED in worker/index.js. This is the same map for
# an nginx host, should the site ever move. Include it inside the
# server { } block for certblueprint.com.
#
# Anchored regex locations, so /navigator/plan/cloud/ never catches
# /navigator/plan/cloud-engineer/ (a real page). The optional trailing slash
# (/?$) covers the slashless variant; $is_args$args keeps the query string.
#
# On a non-Cloudflare host you would also need the two canonicalisation rules
# the Worker applies to every request: www -> apex, and slashless -> trailing
# slash. They are host-specific and not included here.

# Field-level plan URLs -> the field's explore page (indexable).
location ~ ^/navigator/plan/networking/?$ { return 301 https://certblueprint.com/navigator/explore/networking/$is_args$args; }
location ~ ^/navigator/plan/cybersecurity/?$ { return 301 https://certblueprint.com/navigator/explore/cybersecurity/$is_args$args; }
location ~ ^/navigator/plan/systems/?$ { return 301 https://certblueprint.com/navigator/explore/systems/$is_args$args; }
location ~ ^/navigator/plan/cloud/?$ { return 301 https://certblueprint.com/navigator/explore/cloud/$is_args$args; }
location ~ ^/navigator/plan/software/?$ { return 301 https://certblueprint.com/navigator/explore/software/$is_args$args; }
location ~ ^/navigator/plan/data/?$ { return 301 https://certblueprint.com/navigator/explore/data/$is_args$args; }
location ~ ^/navigator/plan/operations/?$ { return 301 https://certblueprint.com/navigator/explore/operations/$is_args$args; }

# Never-published URLs that Search Console reports impressions for.
location ~ ^/vendors/google/google-cybersecurity-certificate-review-cost-worth-it-security/?$ { return 301 https://certblueprint.com/vendors/google/google-cybersecurity/$is_args$args; }
location ~ ^/navigator/compare/application-software-engineer-vs-software-developer/?$ { return 301 https://certblueprint.com/navigator/compare/application-security-engineer-vs-software-developer/$is_args$args; }

# Retired standalone navigator app.
location ~ ^/navigator-app(/|\.html)?$ { return 301 https://certblueprint.com/navigator/$is_args$args; }
