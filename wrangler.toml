name = "certblueprint"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
main = "worker/index.js"

[assets]
directory = "./dist"
binding = "ASSETS"
# Serve the built dist/404.html (with 404 status) for unknown URLs.
# Without this, Workers assets defaults to "none" and returns an empty 404 body.
not_found_handling = "404-page"
# Pages go through the Worker first so it can 301 www.certblueprint.com and
# retired URLs to their canonical home. Hashed build assets skip it — they are
# the bulk of requests and never need a redirect.
run_worker_first = ["/*", "!/_astro/*"]

[ai]
binding = "AI"

# First-party telemetry for certblueprint.com and NetDrill (worker/telemetry.js).
# No database_id on purpose: wrangler creates "certblueprint-telemetry" on the
# first deploy (or connects to it if it already exists) and keeps the binding on
# later deploys. Tables are created by the Worker on first use.
[[d1_databases]]
binding = "DB"
database_name = "certblueprint-telemetry"

# Daily: delete telemetry older than RETENTION_DAYS (worker/telemetry.js).
[triggers]
crons = ["23 4 * * *"]

[vars]
# SHA-256 fingerprint of the command-center key, from the setup screen at
# /command/. Only the fingerprint lives here; the key itself is never stored.
# To retire a lost key: make a new one there and replace this value.
COMMAND_KEY_HASH = ""
